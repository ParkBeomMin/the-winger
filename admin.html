<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>더 윙어 2 · 운영</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#0f1a14;color:#e8f3ec;margin:0;padding:16px;max-width:720px;margin:auto}
h1{font-size:1.3rem}h2{font-size:1.05rem;margin-top:24px;color:#7cf0ac}
.card{background:#162a1f;border-radius:12px;padding:12px;margin:8px 0}
label{display:block;font-size:.8rem;color:#9cb8a7;margin-top:8px}
input,textarea,select{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #2c4a39;background:#0b140f;color:#fff;font-size:.9rem}
textarea{min-height:80px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:9px 14px;border-radius:10px;border:0;background:#43c779;color:#04210f;font-weight:700;cursor:pointer;margin-top:10px}
button.ghost{background:#2c4a39;color:#e8f3ec}button.del{background:#c43b3b;color:#fff;padding:4px 10px;margin:0}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #2c4a39;padding:8px 0;font-size:.85rem}
.small{font-size:.75rem;color:#9cb8a7}#who{font-size:.85rem}
</style></head>
<body>
<h1>⚽ 더 윙어 2 · 운영 페이지</h1>
<p class="small">관리자 구글 계정으로 로그인해야 저장돼요. 게임에는 다음 화면 전환부터 반영돼요(최대 10분 캐시).</p>
<div id="who">로그인 안 됨</div>
<button id="login">구글로 로그인</button>

<h2>🎉 피버 타임</h2>
<div class="card">
  <div class="row"><div><label>이모지</label><input id="fv-emoji" value="🎉"/></div><div style="flex:3"><label>제목</label><input id="fv-title" value="주말 피버 타임"/></div></div>
  <label>설명 (선택)</label><input id="fv-note" placeholder="이번 주말 훈련 효율 2배!"/>
  <div class="row"><div><label>영어 제목 (영어판용, 선택)</label><input id="fv-title-en" placeholder="Weekend Fever Time"/></div><div><label>영어 설명 (선택)</label><input id="fv-note-en" placeholder="Double training this weekend!"/></div></div>
  <div class="row"><div><label>시작 (반복이면 반복 기간의 시작)</label><input type="datetime-local" id="fv-from"/></div><div><label>끝 (반복이면 반복 기간의 끝)</label><input type="datetime-local" id="fv-to"/></div></div>
  <div class="row">
    <div><label>반복</label><select id="fv-rep"><option value="none">반복 없음 (시작~끝 계속)</option><option value="daily">매일</option><option value="weekly">매주 (요일 선택)</option></select></div>
    <div><label>하루 중 시작 (한국 시각)</label><input type="time" id="fv-t0" value="20:00"/></div>
    <div><label>하루 중 끝</label><input type="time" id="fv-t1" value="22:00"/></div>
  </div>
  <div id="fv-days" class="small" style="margin-top:6px"></div>
  <div class="row">
    <div><label>훈련 상승폭 % (최대 100)</label><input type="number" id="fv-train" value="50"/></div>
    <div><label>숙련도 % (최대 100)</label><input type="number" id="fv-mast" value="0"/></div>
    <div><label>명성 % (최대 50)</label><input type="number" id="fv-fame" value="0"/></div>
  </div>
  <div class="row">
    <div><label>수당 % (최대 50)</label><input type="number" id="fv-money" value="0"/></div>
    <div><label>경기 평점 + (최대 0.4)</label><input type="number" step="0.1" id="fv-rate" value="0"/></div>
  </div>
  <button id="fv-save">피버 등록</button>
  <div id="fv-list"></div>
</div>

<h2>📢 공지사항</h2>
<div class="card">
  <label>제목</label><input id="nt-title"/>
  <label>내용</label><textarea id="nt-body"></textarea>
  <label>영어 제목 (영어판용, 선택)</label><input id="nt-title-en"/>
  <label>영어 내용 (선택)</label><textarea id="nt-body-en"></textarea>
  <label><input type="checkbox" id="nt-pin" style="width:auto"/> 📌 상단 고정</label>
  <button id="nt-save">공지 등록</button>
  <div id="nt-list"></div>
</div>

<h2>📮 광고 문의</h2>
<div class="card"><div id="inq-list" class="small">로그인하면 보여요</div></div>

<h2>🏛️ 세계 명예의 전당</h2>
<div class="card"><div id="hof-list" class="small">로그인하면 보여요</div></div>

<script>const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));</script>
<script src="cloud.js?v=1.3"></script>
<script src="admin.js?v=1.4"></script>
</body></html>
