<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>더 윙어 2 : 라이벌 ⚽ 축구선수 키우기</title>
<meta name="description" content="운명의 라이벌과 함께 크는 축구선수 육성 게임. 유스에서 발롱도르까지, 승부처는 직접 해결하세요." />
<meta property="og:title" content="더 윙어 2 : 라이벌" />
<meta property="og:description" content="운명의 라이벌과 함께 크는 축구선수 육성 게임" />
<meta name="theme-color" content="#0b1e14" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b1e14;--bg2:#12291c;--card:#163322;--line:#2a5a3c;--acc:#6ee7a0;--acc2:#ffe45a;--sky:#8fc4ff;--red:#ff7a7a;--text:#eef6f0;--dim:#9db8a6}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:repeating-linear-gradient(90deg,#0b1e14 0 44px,#0d2217 44px 88px);color:var(--text);font-family:"Gowun Dodum",sans-serif;min-height:100vh;font-size:15px}
h1,h2,h3,h4,b,.btn,button{font-family:"Jua",sans-serif;font-weight:400}
#app{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.screen{display:none}.screen.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
button{cursor:pointer;color:inherit;border:0;background:none;font-size:inherit}
button:disabled{opacity:.4;cursor:default}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-size:1.05rem;margin-top:10px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(180deg,#7cf0ac,#43c779);color:#0b2416;box-shadow:0 4px 0 #2a8a52}
.btn-ghost{border:1.5px solid var(--line);color:var(--sky);background:rgba(255,255,255,.02)}
.btn small{display:block;font-family:"Gowun Dodum";font-size:.75rem;opacity:.75;margin-top:2px}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;margin:0;font-size:.95rem}
.hint{color:var(--dim);line-height:1.6;margin:6px 0 12px;font-size:.9rem}
.label{margin:14px 0 6px;color:var(--dim);font-size:.85rem}.label small{opacity:.8}
.small{font-size:.8rem;color:var(--dim);margin-top:8px;line-height:1.5}
.up{color:var(--acc)}.dn{color:var(--red)}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,120,80,.15);border:1px solid rgba(255,140,90,.5);color:#ffc7a8;font-size:.85rem}

/* 타이틀 */
.title-box{text-align:center;padding-top:6vh}
#title-art{width:300px;height:150px}
.title-box h1{font-size:3rem;color:var(--acc);text-shadow:0 4px 0 rgba(0,0,0,.4);margin-top:4px}
.title-box h1 span{color:var(--red);font-size:1.6rem;display:block;margin-top:-4px}
.title-box .desc{color:var(--dim);line-height:1.7;margin:12px 0 22px}
.ver{color:var(--dim);font-size:.75rem;margin-top:18px;opacity:.7}

/* 만들기 */
.create-top{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:.85rem;margin-bottom:6px}
#create-body h2{color:var(--acc);margin:4px 0 10px}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font-size:1.1rem;font-family:"Jua"}
.pos-grid,.org-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(110,231,160,.25) inset;background:#1b3d29}
.card small{color:var(--dim);font-size:.78rem;font-family:"Gowun Dodum"}
.card.org .flag{font-size:1.6rem}.card.org em{color:var(--sky);font-style:normal;font-size:.85rem}.card.org i{font-style:normal;color:var(--acc2);font-size:.75rem}
.seg{display:flex;gap:6px}.seg.wrap{flex-wrap:wrap}
.seg button{flex:1;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);white-space:nowrap}
.seg button.on{border-color:var(--acc);color:var(--acc);background:#1b3d29}
.roll{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;background:var(--bg2);border-radius:12px;padding:10px 12px}
.roll div{display:flex;gap:6px;align-items:center;font-size:.85rem}.roll span{flex:1}.roll i{color:var(--acc2);font-style:normal;font-size:.75rem;letter-spacing:-1px}
.av-preview{display:flex;justify-content:center;background:radial-gradient(circle,#24553a,transparent 70%);border-radius:16px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--acc2)}
.num-row{display:flex;align-items:center;gap:16px}.num-row b{font-size:1.6rem;min-width:44px;text-align:center}

/* 라이벌 등장 */
.kicker{color:var(--dim);text-align:center;margin-top:4vh}
.rv-h{text-align:center;color:var(--red);font-size:2rem;margin:4px 0}
.vs-row{display:flex;align-items:center;justify-content:center;gap:10px}
.vs-row .vs{font-size:2rem;color:var(--acc2)}
.rv-card{background:var(--card);border:1.5px solid rgba(255,122,122,.5);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px}
.rv-card b{font-size:1.4rem}.rv-card span{color:var(--dim);font-size:.85rem}
.rv-card q{font-style:italic;color:#ffd0d0;margin:4px 0}
.cmp{display:flex;justify-content:space-between;font-family:Jua;color:var(--acc2)}

/* 메인 */
.hud{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px}
.hud-av canvas{border-radius:50%;background:#24553a}
.hud-id{flex:1;min-width:0}.hud-id b{display:block;font-size:1.1rem;color:var(--acc)}.hud-id b small{color:var(--dim);font-size:.75rem}
.hud-id span{font-size:.78rem;color:var(--dim)}.hud-id em{color:var(--acc2);font-style:normal;font-family:Jua}
.hud-r{text-align:right}.hud-r b{display:block;color:var(--sky)}.hud-r span{font-size:.8rem}
.hud-btns{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.hud-btns button{flex:1;padding:7px 4px;border-radius:10px;border:1px solid var(--line);font-size:.8rem;color:var(--sky);background:rgba(255,255,255,.02);white-space:nowrap}
.sched{background:rgba(143,196,255,.08);border:1px solid rgba(143,196,255,.35);border-radius:12px;padding:9px 12px;font-size:.88rem}
.sched.warn-on{border-color:rgba(255,140,90,.7)}
.sched em.rv{color:var(--red);font-style:normal;font-family:Jua}
.gauges{margin:10px 0}
.g{display:flex;align-items:center;gap:8px;font-size:.85rem}.g span{width:70px}.g b{width:30px;text-align:right}
.bar{flex:1;height:10px;background:#0a1810;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#43c779,#7cf0ac);border-radius:99px;transition:width .4s}
.bar i.mid{background:linear-gradient(90deg,#d6a531,#f2d16b)}.bar i.low{background:linear-gradient(90deg,#c43b3b,#ff7a7a)}
.g2{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--dim);margin-top:6px}
.g2 .buff{color:var(--acc2)}.g2 .inj{color:var(--red)}
.rival-card{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(255,122,122,.12),rgba(255,122,122,.03));border:1.5px solid rgba(255,122,122,.45);border-radius:14px;padding:8px 10px;cursor:pointer}
.rc-av canvas{border-radius:50%;background:#3a2020}
.rc-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rc-mid b{color:#ffc0c0}.rc-mid b small{color:var(--dim);font-size:.75rem;margin-left:4px}
.rc-mid>span{font-size:.75rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-bar{height:6px;background:#a33;border-radius:99px;overflow:hidden;margin:3px 0}.rc-bar i{display:block;height:100%;background:var(--acc)}
.rc-cmp{font-size:.78rem}.rc-cmp em{font-style:normal;margin-left:4px}.rc-cmp b{color:var(--text)}
.rc-more{font-size:1.4rem;color:var(--dim)}
.stats{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:8px;font-size:.85rem}.st span{width:78px}.st b{width:28px;text-align:right}.st em{font-style:normal;color:var(--acc2);font-size:.7rem;width:56px;letter-spacing:-1px}
.st.key span{color:var(--acc)}
.st .bar i{background:linear-gradient(90deg,#3b7fd6,#8fc4ff)}
.actions-title{font-family:Jua;margin:12px 0 8px;color:var(--acc)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.act span{font-size:1.3rem}.act b{font-size:.82rem}.act small{font-size:.66rem;color:var(--dim)}
.act .risk{position:absolute;top:-6px;right:-4px;background:#c43b3b;color:#fff;font-style:normal;font-size:.6rem;border-radius:8px;padding:1px 5px}
.act.rest{border-color:#3d6aa8}.act.auto{border-color:#a8903d}
.act:active{transform:scale(.95)}
.log{margin-top:12px;font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
.log span{color:var(--sky);margin-right:4px;font-size:.72rem}
.float{position:absolute;transform:translate(-50%,-10px);color:var(--acc2);font-family:Jua;pointer-events:none;animation:up 1.1s forwards;z-index:50;text-shadow:0 2px 4px #000;white-space:nowrap}
.float.bad{color:var(--red)}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}

/* 경기 */
#mt-title{color:var(--acc);font-size:1.3rem}#mt-sub{color:var(--sky);font-family:Jua;margin:2px 0 10px}
.pre{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.pre-vs{display:flex;align-items:center;justify-content:space-between}
.pre-mid{text-align:center;display:flex;flex-direction:column}.pre-mid b{font-size:1.8rem;color:var(--acc2)}.pre-mid small{color:var(--dim);font-size:.75rem}
.crest{width:62px;height:62px;border-radius:50% 50% 45% 45%;border:4px solid;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:1.6rem;color:#fff;text-shadow:0 2px 3px #000;margin:4px}
.pre-rv{margin-top:10px;text-align:center;color:#ffc0c0;background:rgba(255,122,122,.1);border-radius:10px;padding:7px}
.pre-info{margin-top:10px;text-align:center;font-size:.88rem;color:var(--dim)}
.m-board{display:flex;align-items:center;background:#0a1810;border-radius:12px 12px 0 0;padding:8px}
.m-team{flex:1;font-family:Jua;font-size:.85rem;display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden}
.m-team.away{justify-content:flex-end}.m-team i{width:12px;height:12px;border-radius:50%;flex:none}
.m-score{display:flex;align-items:center;gap:4px;background:#000;border-radius:8px;padding:2px 10px;font-family:Jua;position:relative}
.m-score b{font-size:1.6rem;color:#fff}.m-score small{font-size:.75rem;color:var(--acc2);margin-left:6px;min-width:24px}
.m-pitch-wrap{position:relative;border-radius:0 0 12px 12px;overflow:hidden}
.m-pitch{display:block;width:100%}
.m-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:2.6rem;color:var(--acc2);text-shadow:0 4px 0 #000,0 0 30px rgba(255,228,90,.6);pointer-events:none;animation:pop .5s}
.m-flash.bad{color:var(--red);font-size:2rem}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.m-overlay{position:absolute;inset:0;background:rgba(4,14,8,.72);display:flex;align-items:center;justify-content:center;padding:8px}
.mg{width:100%;max-width:340px;text-align:center}
.mg-h b{display:block;color:var(--acc2);font-size:1.15rem}.mg-h span{font-size:.75rem;color:var(--dim)}
.mg-body{margin:8px 0}
.mg-timer{height:5px;background:#333;border-radius:9px;overflow:hidden}.mg-timer i{display:block;height:100%;width:100%;background:var(--acc2)}
.mg-goal{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border:4px solid #fff;border-bottom:0;padding:3px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 4px,transparent 4px 9px);height:110px}
.mg-goal button{border:1.5px dashed rgba(255,255,255,.35);border-radius:6px}
.mg-goal button:active,.mg-goal button.hit{background:rgba(255,228,90,.45)}
.mg-keeper{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:2rem;transition:left .25s;pointer-events:none}
.mg-field{position:relative;height:120px;background:#2a7f44;border-radius:8px}
.mg-field .mate{position:absolute;width:34px;height:34px;border-radius:50%;background:#2a62c9;border:2px solid #fff;transform:translate(-50%,-50%);font-family:Jua;color:#fff}
.mg-field .def{position:absolute;width:16px;height:16px;border-radius:50%;background:#d33;border:2px solid #111;transform:translate(-50%,-50%);transition:all 1s}
.mg-field .me{position:absolute;transform:translate(-50%,-50%);background:var(--acc2);color:#000;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.mg-bar{position:relative;height:30px;background:#0a1810;border-radius:9px;border:2px solid var(--line);overflow:hidden}
.mg-bar .zone{position:absolute;top:0;bottom:0;background:rgba(110,231,160,.55)}
.mg-bar .mk{position:absolute;top:-2px;bottom:-2px;width:5px;background:var(--acc2);transform:translateX(-50%)}
.mg-tap{margin-top:8px}
.mg-tackle .att{font-size:2.6rem;transition:transform .35s}
.mg-tackle .att.lean-left{transform:translateX(-20px) rotate(-14deg)}.mg-tackle .att.lean-right{transform:translateX(20px) rotate(14deg) scaleX(-1)}
.mg-two{display:flex;gap:8px;margin-top:6px}.mg-two button{flex:1;padding:14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-family:Jua}
.m-ctrl{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.82rem}
.tgl{display:flex;align-items:center;gap:4px;color:var(--dim)}
.m-spd{display:flex;gap:4px}.m-spd button{padding:5px 9px;border-radius:8px;border:1px solid var(--line);font-size:.78rem}.m-spd button.on{background:var(--acc);color:#0b2416}
.m-feed{background:var(--bg2);border-radius:12px;padding:8px 10px;max-height:150px;overflow:auto;font-size:.82rem;display:flex;flex-direction:column;gap:3px}
.m-feed .fl span{color:var(--dim);margin-right:6px;font-size:.72rem}
.m-feed .me{color:var(--acc2)}.m-feed .goal{color:var(--acc)}.m-feed .bad{color:var(--red)}.m-feed .rival{color:#ffb0b0}
.result{margin-top:12px;background:var(--card);border:1.5px solid var(--acc);border-radius:16px;padding:14px;text-align:center;animation:fade .3s}
.r-score{font-family:Jua;font-size:1.8rem}.r-score span{font-size:1rem;color:var(--acc2);margin-left:6px}
.r-rating{font-family:Jua;font-size:1.1rem;margin:4px 0}.r-rating b{font-size:1.8rem}
.r-rating.s b{color:var(--acc2)}.r-rating.a b{color:var(--acc)}.r-rating.b b{color:var(--sky)}.r-rating.c b{color:var(--red)}
.r-rating em{font-style:normal;background:var(--acc2);color:#000;border-radius:8px;padding:2px 8px;font-size:.85rem}
.r-stats{color:var(--dim);font-size:.85rem}.r-lines{margin-top:8px;font-size:.85rem;display:flex;flex-direction:column;gap:3px}

/* 계약 / 결산 */
.offer{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.offer:active{border-color:var(--acc)}
.of-mid{display:flex;flex-direction:column;gap:2px;flex:1}.of-mid span{font-size:.78rem;color:var(--dim)}.of-mid em{font-style:normal;font-family:Jua}
.of-mid .rv{color:#ffb0b0}
#ss-title,#of-title{color:var(--acc);margin-bottom:8px}
.ss-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:.88rem;line-height:1.6}
.ss-card h4{color:var(--sky);margin-bottom:6px}
.ss-card.rvc{border-color:rgba(255,122,122,.5)}
.ss-me{display:flex;gap:10px;align-items:center}
.ss-vs{margin-top:6px;font-family:Jua;color:var(--acc2)}
.aw{display:inline-block;background:rgba(255,228,90,.15);color:var(--acc2);border-radius:8px;padding:1px 8px;margin:2px 2px 0 0;font-family:Jua;font-size:.82rem}
.aw.rv{background:rgba(255,122,122,.15);color:#ffb0b0}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.tbl th{color:var(--dim);font-weight:400;padding:3px 2px;border-bottom:1px solid var(--line)}
.tbl td{padding:3px 2px;text-align:center}.tbl td:nth-child(2){text-align:left;white-space:nowrap}
.tbl tr.me td{color:var(--acc);font-family:Jua}.tbl tr.rv td{color:#ffb0b0}
.bl{display:flex;gap:8px;padding:3px 0}.bl span{width:20px;color:var(--dim)}.bl b{flex:1}.bl em{font-style:normal;color:var(--dim)}
.bl.me b{color:var(--acc)}.bl.rv b{color:#ffb0b0}

/* 엔딩 */
#card{width:100%;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.end-rv,.end-list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;font-size:.88rem;line-height:1.6}
.end-rv{border-color:rgba(255,122,122,.5)}.end-rv b,.end-list b{color:var(--acc2)}
.end-list div{color:var(--dim);font-size:.8rem}
.hof-row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.hof-row>span{color:var(--acc2);font-family:Jua;width:18px}.hof-row>div:nth-child(3){flex:1;display:flex;flex-direction:column;font-size:.8rem}
.hof-row b{color:var(--acc)}.hof-row b small{color:var(--dim)}.hof-row em{font-family:Jua;color:var(--acc2);font-style:normal}

/* 모달 / 토스트 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#14301f;border:1.5px solid var(--acc);border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:88vh;overflow:auto;text-align:center;animation:pop .2s}
.mbox.wide{max-width:440px}
.m-emoji{font-size:2.6rem}.mbox h3{color:var(--acc2);margin:4px 0 8px;font-size:1.3rem}
.m-html{line-height:1.7;font-size:.92rem}.ev-text{font-size:1rem}
.m-btns .btn{margin-top:8px}
.tour-sum div{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.85rem;align-items:center}
.tour-sum span{width:74px;color:var(--dim);text-align:left}.tour-sum b{flex:1;text-align:left}.tour-sum em{font-style:normal;font-family:Jua}
.tour-sum em.W{color:var(--acc)}.tour-sum em.L{color:var(--red)}.tour-sum i{font-style:normal;color:var(--acc2);width:30px}
.rv-modal{display:flex;gap:12px;align-items:center;text-align:left;font-size:.85rem;margin-bottom:8px}
.cmp-head,.cmp-row{display:flex;justify-content:space-between;padding:3px 10px}.cmp-head{color:var(--dim);font-size:.75rem}
.cmp-row b{width:36px}.cmp-row.tot{border-top:1px solid var(--line);font-family:Jua;color:var(--acc2)}
.shop-row{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.shop-row>span{font-size:1.6rem}.shop-row div{flex:1;display:flex;flex-direction:column}.shop-row small{color:var(--dim);font-size:.75rem}.shop-row em{color:var(--acc2);font-style:normal}
.aw-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.aw-list span{background:rgba(255,228,90,.12);color:var(--acc2);border-radius:8px;padding:2px 8px;font-size:.75rem}
.help{text-align:left}.help p{margin-bottom:10px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2a5a3c;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:120;font-size:.9rem}
#toast[hidden]{display:none}
</style>
</head>
<body>
<main id="app">

  <section class="screen" id="scr-title">
    <div class="title-box">
      <canvas id="title-art"></canvas>
      <h1>더 윙어 2<span>: 라이벌</span></h1>
      <p class="desc">운명의 라이벌과 함께 크는 축구 인생.<br/>유스에서 발롱도르까지, 승부처는 직접 해결하세요.</p>
      <button class="btn btn-primary" id="btn-new">새 선수 만들기</button>
      <button class="btn btn-ghost" id="btn-continue" hidden>이어하기</button>
      <button class="btn btn-ghost" id="btn-hof">🏛️ 명예의 전당</button>
      <p class="ver" id="ver"></p>
    </div>
  </section>

  <section class="screen" id="scr-create">
    <div class="create-top"><button id="btn-create-home">← 타이틀</button><span id="create-step"></span></div>
    <div id="create-body"></div>
  </section>

  <section class="screen" id="scr-rival"><div id="rival-body"></div></section>

  <section class="screen" id="scr-main">
    <header class="hud" id="hud"></header>
    <div class="hud-btns" id="hud-btns"></div>
    <div class="sched" id="sched"></div>
    <div class="gauges" id="gauges"></div>
    <div class="rival-card" id="rival-card"></div>
    <div class="stats" id="stats"></div>
    <p class="actions-title" id="actions-title"></p>
    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>
  </section>

  <section class="screen" id="scr-match">
    <h2 id="mt-title"></h2>
    <div id="mt-sub"></div>
    <div id="mt-body"></div>
  </section>

  <section class="screen" id="scr-offers">
    <h2 id="of-title"></h2>
    <p class="hint" id="of-hint"></p>
    <div id="of-list"></div>
    <button class="btn btn-ghost" id="of-stay" hidden></button>
  </section>

  <section class="screen" id="scr-season">
    <h2 id="ss-title"></h2>
    <div id="ss-body"></div>
    <div id="ss-acts"></div>
  </section>

  <section class="screen" id="scr-end">
    <h2 style="color:var(--acc);margin-bottom:10px">🎓 은퇴식</h2>
    <div id="end-body"></div>
    <button class="btn btn-primary" id="b-share">📤 선수 카드 공유</button>
    <button class="btn btn-ghost" id="b-again">처음부터 다시</button>
  </section>

  <section class="screen" id="scr-hof">
    <h2 style="color:var(--acc);margin-bottom:10px">🏛️ 명예의 전당</h2>
    <div id="hof-list"></div>
    <button class="btn btn-ghost" id="btn-hof-back">← 돌아가기</button>
  </section>
</main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="data.js"></script>
<script src="avatar.js"></script>
<script src="match.js"></script>
<script src="events.js"></script>
<script src="game.js"></script>
</body>
</html>
